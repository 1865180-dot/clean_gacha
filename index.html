<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポイ捨てゼロ！マナーガチャ</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #ecfdf5;
    }

    /* ガチャマシンアニメーション */
    .crank-rotate {
      animation: rotateCrank 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
    }

    @keyframes rotateCrank {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .machine-shake {
      animation: shakeMachine 0.4s ease-in-out infinite;
    }

    @keyframes shakeMachine {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(-3px, 2px) rotate(-1deg); }
      75% { transform: translate(3px, -2px) rotate(1deg); }
    }

    /* 落ちるカプセル（ズレ防止用に位置調整を調整） */
    .capsule-drop {
      animation: dropCapsule 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes dropCapsule {
      0% {
        transform: translateY(-60px) scale(0.3) rotate(0deg);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      80% {
        transform: translateY(8px) scale(1.05) rotate(180deg);
      }
      100% {
        transform: translateY(0) scale(1) rotate(360deg);
        opacity: 1;
      }
    }

    .bounce-pulse {
      animation: bouncePulse 1.5s infinite;
    }

    @keyframes bouncePulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.03); }
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between selection:bg-emerald-200">

  <!-- ヘッダー -->
  <header class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-md py-4 px-6">
    <div class="max-w-3xl mx-auto flex items-center justify-center gap-3">
      <div class="bg-white/20 p-2 rounded-xl backdrop-blur-md">
        <i data-lucide="sparkles" class="w-7 h-7 text-yellow-300"></i>
      </div>
      <h1 class="text-xl sm:text-2xl font-black tracking-wide drop-shadow-sm text-center">
        ポイ捨てゼロ！マナーガチャ
      </h1>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-md mx-auto flex flex-col items-center">
      
      <!-- キャッチコピー -->
      <div class="text-center mb-6">
        <span class="bg-emerald-100 text-emerald-800 text-xs sm:text-sm font-bold px-3 py-1 rounded-full border border-emerald-300">
          街をきれいに！今日の行動メッセージ
        </span>
        <h2 class="text-lg sm:text-xl font-extrabold text-emerald-950 mt-2">
          ハンドルを回してマナー運勢を占おう！
        </h2>
      </div>

      <!-- ガチャマシン全体 -->
      <div id="gachaContainer" class="relative w-72 sm:w-80 flex flex-col items-center">
        
        <!-- ガチャドーム（透明ケース） -->
        <div class="relative w-64 h-64 sm:w-72 sm:h-72 bg-gradient-to-b from-sky-100/90 to-white/60 rounded-t-full border-4 border-slate-700 shadow-xl overflow-hidden backdrop-blur-sm flex items-center justify-center">
          
          <!-- ハイライト光沢 -->
          <div class="absolute top-4 left-6 w-12 h-20 bg-white/40 rounded-full blur-[2px] transform -rotate-45 pointer-events-none"></div>

          <!-- ドーム内部のカプセルたち -->
          <div id="domeCapsules" class="relative w-48 h-48 flex flex-wrap justify-center items-end gap-2 p-4 transition-transform">
            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-rose-500 to-pink-300 shadow-md transform -rotate-12 border-2 border-white/50"></div>
            <div class="w-11 h-11 rounded-full bg-gradient-to-tr from-amber-500 to-yellow-300 shadow-md transform rotate-45 border-2 border-white/50"></div>
            <div class="w-13 h-13 rounded-full bg-gradient-to-tr from-emerald-500 to-teal-300 shadow-md transform -rotate-45 border-2 border-white/50"></div>
            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-sky-500 to-blue-300 shadow-md transform rotate-12 border-2 border-white/50"></div>
            <div class="w-11 h-11 rounded-full bg-gradient-to-tr from-purple-500 to-indigo-300 shadow-md transform -rotate-30 border-2 border-white/50"></div>
            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-orange-500 to-amber-300 shadow-md transform rotate-25 border-2 border-white/50"></div>
          </div>
        </div>

        <!-- マシン土台 -->
        <div class="relative w-72 sm:w-80 bg-gradient-to-b from-rose-500 to-red-600 rounded-b-3xl border-4 border-slate-700 shadow-2xl p-4 flex flex-col items-center">
          
          <!-- ダイヤル/ハンドル部分 -->
          <div class="relative mb-6">
            <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-slate-200 border-4 border-slate-700 flex items-center justify-center shadow-inner">
              <button 
                id="crankBtn" 
                onclick="playGacha()"
                class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-white border-2 border-slate-300 flex items-center justify-center shadow-md active:scale-95 transition-transform cursor-pointer focus:outline-none group disabled:opacity-80 disabled:cursor-not-allowed"
              >
                <!-- ダイヤルのツマミ -->
                <div id="crankHandle" class="w-16 h-5 sm:w-20 sm:h-6 bg-slate-700 rounded-full flex items-center justify-between px-1 shadow-sm group-hover:bg-slate-800">
                  <div class="w-3 h-3 rounded-full bg-slate-400"></div>
                  <div class="w-3 h-3 rounded-full bg-slate-400"></div>
                </div>
              </button>
            </div>
          </div>

          <!-- 排出口エリア（overflow-visibleで飛び出しを許容） -->
          <div class="relative w-44 h-20 bg-slate-800 rounded-xl border-4 border-slate-900 shadow-inner flex items-center justify-center overflow-visible">
            
            <!-- 出現するカプセル（中心配置を確定させるクラスを付与） -->
            <div 
              id="dispensedCapsuleContainer" 
              class="hidden absolute inset-x-0 -bottom-3 m-auto w-fit z-30 flex flex-col items-center cursor-pointer" 
              onclick="openCapsule()"
            >
              
              <!-- タップ案内バッジ -->
              <div id="tapBadge" class="z-40 bg-yellow-400 text-slate-900 font-extrabold text-xs px-3 py-1 rounded-full shadow-lg border-2 border-slate-800 flex items-center gap-1 bounce-pulse mb-1 whitespace-nowrap">
                <i data-lucide="pointer" class="w-3.5 h-3.5"></i>
                <span>タップで開く！</span>
              </div>

              <!-- カプセル本体 -->
              <div id="dispensedCapsule" class="w-16 h-16 rounded-full shadow-2xl border-2 border-white/60 flex items-center justify-center transform hover:scale-105 transition-transform overflow-hidden">
                <div class="w-full h-1/2 bg-white/30 rounded-t-full border-b border-white/40"></div>
              </div>
            </div>

          </div>

        </div>

      </div>

      <!-- ガチャ回すボタン -->
      <button 
        id="actionBtn"
        onclick="playGacha()" 
        class="mt-8 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 disabled:from-slate-400 disabled:to-slate-500 text-white font-extrabold text-lg px-8 py-3.5 rounded-full shadow-lg border-2 border-emerald-300 flex items-center gap-2 active:scale-95 transition-all disabled:scale-100 disabled:cursor-not-allowed"
      >
        <i data-lucide="rotate-cw" class="w-5 h-5"></i>
        <span>ガチャを回す！</span>
      </button>

    </div>
  </main>

  <!-- フッター -->
  <footer class="text-center py-4 text-xs text-slate-500 border-t border-emerald-100 bg-white/50">
    <p>ポイ捨てゼロ！マナーガチャ &copy; SANCHIKU JHS</p>
  </footer>

  <!-- 結果モーダル -->
  <div id="resultModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl border-4 border-emerald-500 shadow-2xl max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0 duration-300" id="modalCard">
      
      <!-- おみくじ結果バッジ -->
      <div id="fortuneRank" class="inline-block bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-900 font-black text-xl px-6 py-1.5 rounded-full shadow-md border-2 border-white mb-3">
        超美化大吉
      </div>

      <h3 id="fortuneTitle" class="text-xl font-black text-slate-800 mb-4">
        小さな拾い物が大きな徳に！
      </h3>

      <!-- アイコン表示領域 -->
      <div class="w-20 h-20 mx-auto mb-4 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-600 border-2 border-emerald-200">
        <i id="fortuneIcon" data-lucide="sparkles" class="w-10 h-10"></i>
      </div>

      <!-- アドバイス文章 -->
      <p id="fortuneDesc" class="text-slate-600 text-sm font-bold leading-relaxed mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200 text-left">
        メッセージが入ります。
      </p>

      <!-- 操作ボタン -->
      <button 
        onclick="closeModal()" 
        class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-extrabold py-3.5 px-4 rounded-xl shadow-md border border-emerald-400 active:scale-95 transition-all flex items-center justify-center gap-2"
      >
        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
        <span>もう一度引く</span>
      </button>

    </div>
  </div>

  <script>
    // --- アイコン初期化 ---
    lucide.createIcons();

    // --- 音声効果 (Web Audio API) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // ガチャ回転音
    function playCrankSound() {
      initAudio();
      if (!audioCtx) return;
      
      let count = 0;
      const interval = setInterval(() => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150 + Math.random() * 50, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);

        count++;
        if (count > 8) clearInterval(interval);
      }, 100);
    }

    // 開封音
    function playOpenSound() {
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
        gain.gain.setValueAtTime(0.15, now + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.08);
        osc.stop(now + idx * 0.08 + 0.3);
      });
    }

    // --- マナーガチャデータ ---
    const gachaData = [
      {
        rank: "超美化大吉",
        title: "拾ったゴミの分だけ運気爆揚げ！",
        desc: "今日目についたゴミを1つ拾ってゴミ箱へ。あなたの小さな行動が、街とあなたの運気を最高にクリーンにします！",
        icon: "sparkles",
        color: "from-rose-500 to-pink-400"
      },
      {
        rank: "究極クリーン大吉",
        title: "マイボトル所持でエコの極み！",
        desc: "ペットボトルの買いなおしを減らせるマイボトルは最強の美化アイテム。今日は水分補給とともにプラスチック削減！",
        icon: "heart-handshake",
        color: "from-amber-500 to-yellow-400"
      },
      {
        rank: "徳積み 中吉",
        title: "ポケットの中の小さな気配り",
        desc: "小さなガムの包み紙やレシート、ポケットに持ち帰るあなたは街の隠れたヒーローです！",
        icon: "smile",
        color: "from-emerald-500 to-teal-400"
      },
      {
        rank: "マナー 中吉",
        title: "自動販売機横のゴミ箱を救う！",
        desc: "自販機横のボックスは「空き缶・ペットボトル専用」。正しく分別してあふれ防止に貢献しよう！",
        icon: "recycle",
        color: "from-sky-500 to-blue-400"
      },
      {
        rank: "エコ 吉",
        title: "風に飛ばされる前にキャッチ！",
        desc: "レジ袋や紙くずは風に乗って散らかりがち。バッグのチャックをしっかり閉めてポイ捨て事故を防ぎましょう！",
        icon: "wind",
        color: "from-purple-500 to-indigo-400"
      }
    ];

    let currentResult = null;
    let isSpinning = false;

    // --- ガチャ実行処理 ---
    function playGacha() {
      if (isSpinning) return;
      isSpinning = true;

      const crankHandle = document.getElementById('crankHandle');
      const crankBtn = document.getElementById('crankBtn');
      const domeCapsules = document.getElementById('domeCapsules');
      const capsuleContainer = document.getElementById('dispensedCapsuleContainer');
      const actionBtn = document.getElementById('actionBtn');

      capsuleContainer.classList.add('hidden');
      capsuleContainer.classList.remove('capsule-drop');

      crankBtn.disabled = true;
      actionBtn.disabled = true;

      playCrankSound();
      crankHandle.classList.add('crank-rotate');
      domeCapsules.classList.add('machine-shake');

      setTimeout(() => {
        crankHandle.classList.remove('crank-rotate');
        domeCapsules.classList.remove('machine-shake');

        currentResult = gachaData[Math.floor(Math.random() * gachaData.length)];

        const dispensedCapsule = document.getElementById('dispensedCapsule');
        dispensedCapsule.className = `w-16 h-16 rounded-full shadow-2xl border-2 border-white/60 flex items-center justify-center overflow-hidden bg-gradient-to-tr ${currentResult.color}`;

        capsuleContainer.classList.remove('hidden');
        capsuleContainer.classList.add('capsule-drop');

        crankBtn.disabled = false;
        actionBtn.disabled = false;
        isSpinning = false;
      }, 1200);
    }

    // --- カプセル開封・結果表示 ---
    function openCapsule() {
      if (!currentResult) return;

      playOpenSound();

      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 }
        });
      }

      document.getElementById('fortuneRank').textContent = currentResult.rank;
      document.getElementById('fortuneTitle').textContent = currentResult.title;
      document.getElementById('fortuneDesc').textContent = currentResult.desc;

      const iconElem = document.getElementById('fortuneIcon');
      iconElem.setAttribute('data-lucide', currentResult.icon);
      lucide.createIcons();

      const modal = document.getElementById('resultModal');
      const modalCard = document.getElementById('modalCard');
      modal.classList.remove('hidden');
      
      setTimeout(() => {
        modalCard.classList.remove('scale-95', 'opacity-0');
        modalCard.classList.add('scale-100', 'opacity-100');
      }, 10);
    }

    // --- モーダルを閉じる ---
    function closeModal() {
      const modal = document.getElementById('resultModal');
      const modalCard = document.getElementById('modalCard');

      modalCard.classList.remove('scale-100', 'opacity-100');
      modalCard.classList.add('scale-95', 'opacity-0');

      setTimeout(() => {
        modal.classList.add('hidden');
        const capsuleContainer = document.getElementById('dispensedCapsuleContainer');
        capsuleContainer.classList.add('hidden');
      }, 200);
    }
  </script>
</body>
</html>
